name: Build Windows app (EXE)
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  win:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx electron-builder --win --x64 --publish never
      # Release notes come from CHANGELOG.md (the section for the version in package.json)
      - run: node scripts/release-notes.js
      # Publish a GitHub Release so installed copies can find the update (needs a new version in package.json)
      - id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Kinora ${{ steps.ver.outputs.v }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(steps.ver.outputs.v, '-') }}
          # The .yml and .blockmap files are the update manifest the Windows app reads to update itself
          files: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
      - uses: actions/upload-artifact@v4
        with:
          name: Kinora-Windows
          path: dist/*.exe
