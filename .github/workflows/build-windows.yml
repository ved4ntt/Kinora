name: Build Windows app (EXE)
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Kinora-Windows
          path: dist/*.exe
