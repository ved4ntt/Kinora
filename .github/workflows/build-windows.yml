name: Build Windows app (EXE)
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  win:
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm install
      # Every push gets its own version (0.3.<number of commits>), so every build is a new release
      - run: node scripts/stamp-version.js
      - run: npx electron-builder --win --x64 --publish never
      # Release notes come from CHANGELOG.md (the section for the version in package.json)
      - run: node scripts/release-notes.js
      # Publish a GitHub Release so installed copies can find the update (needs a new version in package.json)
      - id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Kinora ${{ steps.ver.outputs.v }}
          body_path: RELEASE_NOTES.md
          prerelease: true
          # The .yml and .blockmap files are the update manifest the Windows app reads to update itself
          files: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
      - uses: actions/upload-artifact@v7
        with:
          name: Kinora-Windows
          path: dist/*.exe
