name: Build Android app (APK)
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: cp android-overrides/MainActivity.java android/app/src/main/java/app/kinora/player/MainActivity.java
      # Let kinora://auth open the app again after Google sign-in in the browser
      - run: |
          python3 - <<'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          if 'android:scheme="kinora"' not in s:
              f = '<intent-filter><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="kinora" android:host="auth"/></intent-filter>'
              s = s.replace('</activity>', f + '</activity>', 1)
              open(p, 'w', encoding='utf-8').write(s)
          print('kinora deep link:', 'android:scheme="kinora"' in open(p, encoding='utf-8').read())
          PY
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      # Sign with the fixed Kinora key (same signature on every build, so updates install over old versions)
      - run: base64 -d android-overrides/kinora.jks.b64 > android/app/kinora.jks
      - run: cp android-overrides/signing.gradle android/app/signing.gradle
      - run: |
          echo "apply from: 'signing.gradle'" >> android/app/build.gradle
      - run: ./gradlew assembleRelease
        working-directory: android
      - run: cp android/app/build/outputs/apk/release/app-release.apk Kinora.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kinora-Android-APK
          path: Kinora.apk
