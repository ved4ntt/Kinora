name: Build Android app (APK)
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      # Every push gets its own version (0.3.<number of commits>), so every build is a new release
      - run: node scripts/stamp-version.js
      - run: npx cap add android
      - run: cp android-overrides/MainActivity.java android/app/src/main/java/app/kinora/player/MainActivity.java
      # Stamp the app version so Kinora can tell when a newer build exists
      - run: |
          V=$(node -p "require('./package.json').version")
          CODE=$(node scripts/android-version-code.js)
          export APP_VERSION="$V" APP_VERSION_CODE="$CODE"
          python3 - <<'PY'
          import os
          import re
          p = 'android/app/build.gradle'
          s = open(p, encoding='utf-8').read()
          code = os.environ['APP_VERSION_CODE']
          version = os.environ['APP_VERSION']
          s, a = re.subn(r'(?m)^([ \t]*)versionCode[ \t]+\d+[ \t]*$', lambda m: m.group(1) + 'versionCode ' + code, s, count=1)
          s, b = re.subn(r'(?m)^([ \t]*)versionName[ \t]+["\'][^"\']+["\'][ \t]*$', lambda m: m.group(1) + 'versionName "' + version + '"', s, count=1)
          if a != 1 or b != 1:
              raise SystemExit('Could not stamp Android versionCode/versionName')
          open(p, 'w', encoding='utf-8').write(s)
          print('Android version:', version, 'code:', code)
          PY
          grep -n "version" android/app/build.gradle | head
      # Let kinora://auth open the app again after Google sign-in in the browser
      - run: |
          python3 - <<'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          if 'android:scheme="kinora"' not in s:
              f = '<intent-filter><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="kinora" android:host="auth"/></intent-filter>'
              s = s.replace('</activity>', f + '</activity>', 1)
              open(p, 'w', encoding='utf-8').write(s)
          print('kinora deep link:', 'android:scheme="kinora"' in open(p, encoding='utf-8').read())
          PY
      # More memory for 4K files, and hardware acceleration for the page
      - run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          if 'android:largeHeap' not in s:
              s = s.replace('<application', '<application android:largeHeap="true"', 1)
          if 'android:hardwareAccelerated' not in s:
              s = s.replace('<application', '<application android:hardwareAccelerated="true"', 1)
          open(p, 'w', encoding='utf-8').write(s)
          print('largeHeap:', 'android:largeHeap' in s)
          PY
      # Draw the icon and splash images, turn them into Android resources, then add the animated splash + themed icon
      - run: npm i --no-save sharp && node scripts/make-brand.mjs
      - run: npx capacitor-assets generate --android
      - run: python3 scripts/android-brand.py
      - run: npx cap sync android
      - run: cp android-overrides/MainActivity.java android/app/src/main/java/app/kinora/player/MainActivity.java
      - run: cp android-overrides/KEngine.java android/app/src/main/java/app/kinora/player/KEngine.java
      # Sign with the fixed Kinora key (same signature on every build, so updates install over old versions)
      # Print the version the APK will carry (must equal the release number)
      - run: node -p "'APK version ' + require('./package.json').version"
      - run: base64 -d android-overrides/kinora.jks.b64 > android/app/kinora.jks
      - run: cp android-overrides/signing.gradle android/app/signing.gradle
      - run: |
          echo "apply from: 'signing.gradle'" >> android/app/build.gradle
      # ExoPlayer (Media3) gives the app smooth native playback. The FFmpeg audio decoder (DTS, AC3, TrueHD) is added when it can be downloaded.
      - run: |
          cat >> android/app/build.gradle <<'EOF'

          dependencies {
              implementation 'androidx.media3:media3-exoplayer:1.3.1'
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
              implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
              implementation 'androidx.media3:media3-ui:1.3.1'
          }
          android { lint { checkReleaseBuilds false; abortOnError false }; compileOptions { coreLibraryDesugaringEnabled true }; defaultConfig { ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' } } }
          EOF
          if curl -fsI "https://repo1.maven.org/maven2/org/jellyfin/media3/media3-ffmpeg-decoder/1.3.1+1/media3-ffmpeg-decoder-1.3.1+1.pom" >/dev/null; then
            sed -i "s#implementation 'androidx.media3:media3-ui:1.3.1'#&\n    implementation 'org.jellyfin.media3:media3-ffmpeg-decoder:1.3.1+1'#" android/app/build.gradle
            echo "FFmpeg decoder added"
          fi
          # libVLC is the second engine: it plays what ExoPlayer cannot (10-bit HEVC, DTS, TrueHD, odd MKV) and streams that cannot be seeked
          for LV in 3.6.2 3.6.0; do
            if curl -fsI "https://repo1.maven.org/maven2/org/videolan/android/libvlc-all/$LV/libvlc-all-$LV.pom" >/dev/null; then
              sed -i "s#implementation 'androidx.media3:media3-ui:1.3.1'#&\n    implementation 'org.videolan.android:libvlc-all:$LV'#" android/app/build.gradle
              cp android-overrides/VlcEngine.java android/app/src/main/java/app/kinora/player/VlcEngine.java
              echo "VLC engine added ($LV)"
              break
            fi
          done
          tail -15 android/app/build.gradle
      # If the VLC engine ever fails to compile, the app is built again without it (ExoPlayer only) instead of losing the whole release
      - run: |
          ./gradlew assembleRelease || {
            echo "::warning::Build failed with the VLC engine, retrying without it"
            rm -f app/src/main/java/app/kinora/player/VlcEngine.java
            sed -i "/libvlc-all/d" app/build.gradle
            ./gradlew assembleRelease
          }
        working-directory: android
      - run: cp android/app/build/outputs/apk/release/app-release.apk Kinora.apk
      # Publish a GitHub Release so installed copies can find the update (needs a new version in package.json)
      # Release notes come from CHANGELOG.md (the section for the version in package.json)
      - run: node scripts/release-notes.js
      - id: ver
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Kinora ${{ steps.ver.outputs.v }}
          body_path: RELEASE_NOTES.md
          # A normal (not pre-release) release, so https://github.com/ved4ntt/Kinora/releases/latest/download/Kinora.apk always points at the newest build
          prerelease: false
          make_latest: true
          files: Kinora.apk
      - uses: actions/upload-artifact@v7
        with:
          name: Kinora-Android-APK
          path: Kinora.apk
