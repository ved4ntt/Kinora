// Applied to the generated Android project by the GitHub workflow.
// Signs the release APK with a fixed key so it installs cleanly and can update over older installs.
//
// VERSION: the app version is the SAME number as the GitHub release (package.json, stamped by scripts/stamp-version.js, e.g. 0.3.57).
// Before, this file hard-coded "1.0.<run>", so the app said 1.0.x while releases said 0.3.x and the update check was always confused.
import groovy.json.JsonSlurper

def pkg = new JsonSlurper().parseText(file('../../package.json').text)
def verName = String.valueOf(pkg.version)
def parts = verName.split('-')[0].split('\\.')
def vMajor = parts.length > 0 ? (parts[0] as int) : 0
def vMinor = parts.length > 1 ? (parts[1] as int) : 0
def vPatch = parts.length > 2 ? (parts[2] as int) : 0
// 0.3.57 -> 30057. Always grows with the commit count, so every new build installs over the old one.
def verCode = vMajor * 1000000 + vMinor * 10000 + vPatch
// Builds made before this fix used the GitHub run number (small numbers), so this is always higher.
if (verCode < 1000) verCode = 1000 + (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    signingConfigs {
        release {
            storeFile file('kinora.jks')
            storePassword 'eXwl7iau0mzoV33WfPj7'
            keyAlias 'kinora'
            keyPassword 'eXwl7iau0mzoV33WfPj7'
        }
    }
    defaultConfig {
        versionCode verCode
        versionName verName
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            debuggable false
        }
    }
}

println "Kinora Android version: ${verName} (code ${verCode})"
