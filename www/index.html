<script>
/* Profiles: a non-main profile keeps its own library, history, ratings and settings under its own keys. This runs first so every later script sees them. */
(function(){try{
 var a=localStorage.getItem('kprof');if(!a||a==='main')return;
 var L=JSON.parse(localStorage.getItem('kprofs')||'[]');if(!L.some(function(p){return p.id===a})){localStorage.setItem('kprof','main');return}
 var NS={lib:1,st:1,ew:1,prog:1,cfg:1,me:1,av:1,recent:1},P=Storage.prototype,g=P.getItem,s=P.setItem,r=P.removeItem;
 window.__kRaw={get:function(k){return g.call(localStorage,k)}};window.__kProf=a;
 var m=function(k){return NS[k]?'kp:'+a+':'+k:k};
 P.getItem=function(k){return g.call(this,this===localStorage?m(k):k)};
 P.setItem=function(k,v){return s.call(this,this===localStorage?m(k):k,v)};
 P.removeItem=function(k){return r.call(this,this===localStorage?m(k):k)};
 document.documentElement.classList.add('kprofile');
}catch(e){}})();
</script>

<script>
/* ---------- helpers ---------- */
const $=(s,e=document)=>e.querySelector(s);
const h=s=>s==null?'':String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){localStorage.setItem(k,JSON.stringify(v))}};
const app=$('#app'),pop=$('#pop'),pm=$('#pm');
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),3200)}
const I={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',film:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/>',tv:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M8 2l4 4 4-4"/>',lib:'<path d="M16 6l4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',play:'<path d="M7 4l13 8-13 8z" fill="currentColor"/>',pause:'<path d="M8 5v14M16 5v14" stroke-width="2.8"/>',plus:'<path d="M12 5v14M5 12h14"/>',check:'<path d="M5 12l5 5 9-10"/>',back:'<path d="M15 5l-7 7 7 7"/>',src:'<path d="M4 6h16M4 12h16M4 18h16"/>',cc:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 10.5a2 2 0 1 0 0 3M17 10.5a2 2 0 1 0 0 3"/>',speed:'<path d="M12 14l4-4"/><path d="M3.3 17a9 9 0 1 1 17.4 0"/>',vol:'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/>',mute:'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/>',full:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',rw:'<path d="M11 6l-7 6 7 6zM20 6l-7 6 7 6z"/>',ff:'<path d="M13 6l7 6-7 6zM4 6l7 6-7 6z"/>',next:'<path d="M5 5l10 7-10 7zM19 5v14"/>'};
const ic=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
const LOGO='<svg class="lm" viewBox="330 255 620 720" aria-hidden="true"><g fill="url(#kg)"><path d="M520 272Q538 268 538 292V948Q538 968 516 958L362 862Q340 846 340 820V432Q340 396 366 376Z"/><path d="M548 642L738 406Q752 392 782 392H914Q936 394 924 412L692 660Q672 686 640 676Q586 662 548 642Z"/><path d="M548 690Q650 688 722 726Q790 764 872 884L932 944Q942 958 920 962H772Q724 956 694 912L588 762Q556 726 548 690Z"/></g></svg>';
const LD=`<div class="ldw"><div class="ld">${LOGO}</div></div>`,LDS=LD.replace('ldw','ldw sm');

/* ---------- dock, profile popup, sliding indicators ---------- */
const nl=(r,i,t)=>`<a href="#/${r}" data-r="${r}" aria-label="${t}">${ic(i)}<b>${t}</b></a>`;
const ini=n=>n?h(n[0].toUpperCase()):ic('user');
function dock(){
  const n=LS.get('me','');
  $('#dock').innerHTML=`<div class="grp"><i class="ind"></i><a class="logo" href="#/" aria-label="Kinora">${LOGO}<span>KINORA</span></a>${[['','home','Home'],['discover/movie','film','Movies'],['discover/series','tv','Series'],['library','lib','Library']].map(x=>nl(...x)).join('')}</div>
  <div class="grp"><i class="ind"></i><form id="sf">${ic('search')}<input type="search" placeholder="Search movies and series" aria-label="Search"></form>${nl('settings','gear','Settings')}<button id="pb" aria-label="Profile"><span class="av">${ini(n)}</span></button></div>`;
  const inp=$('#sf input');let st;
  $('#sf').onsubmit=e=>{e.preventDefault();clearTimeout(st);const q=inp.value.trim();if(q)location.hash='#/search/'+encodeURIComponent(q)};
  inp.oninput=()=>{clearTimeout(st);const q=inp.value.trim();if(q.length>1)st=setTimeout(()=>location.hash='#/search/'+encodeURIComponent(q),450)};
  $('#pb').onclick=e=>{e.stopPropagation();pm.classList.toggle('on')};
  pm.innerHTML=`<div class="pr"><span class="av big" id="pav">${ini(n)}</span><input class="t" id="nm" value="${h(n)}" placeholder="Your name" maxlength="30" aria-label="Your name"></div><p class="sub">Sign-in and sync across devices are coming later. Your name and library stay on this device.</p><a class="btn" href="#/settings">Open settings</a>`;
  $('#nm').oninput=e=>{const v=e.target.value.trim();LS.set('me',v);$('#pav').innerHTML=$('#pb .av').innerHTML=ini(v)};
}
document.addEventListener('click',e=>{if(!e.target.closest('#pm'))pm.classList.remove('on')});
function slide(){
  const t0=performance.now();
  (function f(){
    document.querySelectorAll('.grp,.tabs').forEach(g=>{
      const a=g.querySelector('.on'),i=g.querySelector(':scope>.ind');if(!i)return;
      if(!a){i.style.opacity=0;return}
      i.style.opacity=1;i.style.width=a.offsetWidth+'px';i.style.transform=`translateX(${a.offsetLeft}px)`;
    });
    if(performance.now()-t0<650)requestAnimationFrame(f);
  })();
}
function syncNav(){
  const path=location.hash.slice(2);
  document.querySelectorAll('#dock [data-r]').forEach(a=>{const x=a.dataset.r;a.classList.toggle('on',x===''?path==='':path.startsWith(x))});
  slide();
}

/* ---------- ambient colour from the movie's artwork ---------- */
let base='',ai=0;
function apply(u){const L=document.querySelectorAll('#amb div');ai^=1;const n=L[ai],o=L[ai^1];if(u){n.style.backgroundImage=`url("${u}")`;n.classList.add('on')}else n.classList.remove('on');o.classList.remove('on')}
const setAmb=u=>{base=u||'';apply(base)};

/* ---------- Stremio add-on protocol (cached, de-duplicated requests) ---------- */
const CINEMETA='https://v3-cinemeta.strem.io/manifest.json';
let addons=LS.get('addons',[]),PICK=null;
const cache=new Map();
const slim=m=>({id:m.id,type:m.type,name:m.name,poster:m.poster,background:m.background,logo:m.logo,description:(m.description||'').slice(0,600),imdbRating:m.imdbRating,releaseInfo:m.releaseInfo,year:m.year,genres:m.genres,runtime:m.runtime});
const getJSON=u=>{
  if(cache.has(u))return cache.get(u);
  const isC=/\/catalog\//.test(u),k='c:'+u,hit=isC?LS.get(k,null):null,age=hit?Date.now()-hit.t:1e12;
  const net=()=>fetch(u).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(j=>{if(isC&&j.metas){try{LS.set(k,{t:Date.now(),j:{metas:j.metas.map(slim)}})}catch{Object.keys(localStorage).filter(x=>x.startsWith('c:')).forEach(x=>localStorage.removeItem(x))}}return j});
  let p;
  if(hit&&age<864e5){p=Promise.resolve(hit.j);if(age>6e5)net().catch(()=>{})}
  else p=net().catch(e=>{cache.delete(u);throw e});
  cache.set(u,p);return p;
};
const bs=u=>u.replace(/\/manifest\.json.*$/,'').replace(/\/$/,'');
const call=(a,res,type,id,extra)=>getJSON(`${bs(a.url)}/${res}/${type}/${encodeURIComponent(id)}${extra?'/'+extra:''}.json`);
const has=(a,res,type,id)=>(a.manifest.resources||[]).some(r=>{
  if((r.name||r)!==res)return false;
  const t=r.types||a.manifest.types||[],p=r.idPrefixes||a.manifest.idPrefixes;
  return(!t.length||t.includes(type))&&(!p||!id||p.some(x=>id.startsWith(x)));
});
const cats=()=>addons.flatMap(a=>(a.manifest.catalogs||[]).map(c=>{const x=(c.extra||[]).map(e=>typeof e==='string'?{name:e}:e),req=new Set(c.extraRequired||[]);(c.extraSupported||[]).forEach(n=>{if(!x.some(e=>e.name===n))x.push({name:n,isRequired:req.has(n)})});return{a,c:Object.assign({},c,{extra:x,name:c.name||c.id,type:c.type==='tv'?'series':c.type})}}).filter(({c})=>!c.extra.some(e=>e.isRequired&&e.name!=='genre')&&c.id&&c.type));
async function addAddon(raw){
  let u=raw.trim().replace(/^stremio:\/\//,'https://');
  if(!/^https?:\/\//.test(u))throw Error('Enter a full link that starts with https://');
  if(!/manifest\.json/.test(u))u=u.replace(/\/$/,'')+'/manifest.json';
  if(addons.some(a=>a.url===u))throw Error('This source is already added');
  const m=await getJSON(u);
  if(!m.id||!m.resources)throw Error('This link is not a valid add-on manifest');
  addons.push({url:u,manifest:m});LS.set('addons',addons);return m;
}

/* ---------- renderers ---------- */
const M={};
const poster=m=>m.poster||'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="450"><rect width="300" height="450" fill="#1a1d24"/></svg>');
const dt=m=>`#/title/${m.type}/${encodeURIComponent(m.id)}`;
const card=(m,i)=>{if(CFG().hideAdult&&adult(m))return'';const k=m.type+'|'+m.id;M[k]=m;return`<a class="card" data-k="${h(k)}" style="--i:${Math.min(i||0,24)}" href="${dt(m)}"><img loading="lazy" decoding="async" src="${h(poster(m))}" alt="${h(m.name)}">${adult(m)?'<i class="eb">E</i>':''}<div class="co"><span class="cp">${ic('play')}</span><b>${h(m.name)}</b><small>${h(m.releaseInfo||m.year||'')}${m.imdbRating?' ★ '+h(m.imdbRating):''}</small></div></a>`};
const row=(t,items)=>`<section class="row"><h2>${h(t)}</h2><div class="scroll">${items.join('')}</div></section>`;
const mt=m=>[m.imdbRating&&'★ '+m.imdbRating,m.releaseInfo||m.year,m.runtime,(m.genres||[]).slice(0,3).join(', ')].filter(Boolean).map(h).join(' · ');
const typeLabel=t=>t==='movie'?'Movies':t==='series'?'Series':t;
const qc=s=>{const m=((s.name||'')+' '+(s.title||s.description||'')).match(/2160p|4k|1080p|720p|480p/i);return m?`<b class="qc">${m[0].toUpperCase()}</b>`:''};
const ft=s=>{s=Math.max(0,s|0);const H=s/3600|0,m=(s%3600)/60|0;return(H?H+':'+String(m).padStart(2,'0'):m)+':'+String(s%60).padStart(2,'0')};
const logoOrName=m=>m.logo?`<img class="lg" src="${h(m.logo)}" alt="${h(m.name)}">`:`<h1>${h(m.name)}</h1>`;
function toggleLib(m){const l=LS.get('lib',{}),k=m.type+m.id;l[k]?delete l[k]:l[k]={id:m.id,type:m.type,name:m.name,poster:m.poster};LS.set('lib',l);toast(l[k]?'Added to library':'Removed from library');return !!l[k]}
const inLib=m=>!!LS.get('lib',{})[m.type+m.id];
const watchUrl=(type,id,vid)=>`#/watch/${type}/${encodeURIComponent(id)}${vid?'/'+encodeURIComponent(vid):''}`;

/* ---------- hover preview: mini on a quick hover, bigger as you stay ---------- */
let pt,t1,t2,cur;
function showPop(c){
  const m=M[c.dataset.k];if(!m)return;
  const r=c.getBoundingClientRect(),was=pop.classList.contains('on');
  if(!was){pop.style.transition='none'}
  pop.style.left=Math.min(Math.max(187,r.left+r.width/2),innerWidth-187)+'px';
  pop.style.top=Math.min(Math.max(76,r.top-24),innerHeight-440)+'px';
  pop.innerHTML=`<img src="${h(m.background||m.poster||'')}" alt=""><div class="in"><div class="acts"><a class="pb" href="${dt(m)}" aria-label="Open">${ic('play')}</a><button class="pb g${inLib(m)?' on':''}" data-lib aria-label="Library">${ic(inLib(m)?'check':'plus')}</button></div><b class="pn">${h(m.name)}</b><div class="mt">${[m.imdbRating&&'★ '+m.imdbRating,m.releaseInfo||m.year].filter(Boolean).map(h).join(' · ')}<span class="gn">${(m.genres||[]).length?' · '+h(m.genres.slice(0,2).join(', ')):''}</span></div><div class="more"><p>${h(m.description||'')}</p><div class="chips">${[m.runtime,...(m.genres||[]).slice(0,4)].filter(Boolean).map(g=>`<span>${h(g)}</span>`).join('')}</div></div></div>`;
  if(!was){pop.offsetWidth;pop.style.transition=''}
  pop.classList.remove('md','xl');pop.classList.add('on');
  clearTimeout(t1);clearTimeout(t2);t1=setTimeout(()=>pop.classList.add('md'),650);t2=setTimeout(()=>pop.classList.add('xl'),1500);
  apply(m.background||m.poster);
}
function leave(){clearTimeout(pt);clearTimeout(t1);clearTimeout(t2);if(cur){cur=null;apply(base)}pop.classList.remove('on','md','xl')}
app.addEventListener('mouseover',e=>{const c=e.target.closest('.card[data-k]');if(c&&c!==cur){clearTimeout(pt);cur=c;pt=setTimeout(()=>showPop(c),pop.classList.contains('on')?60:130)}});
app.addEventListener('mouseout',e=>{const c=e.target.closest('.card[data-k]');if(c&&!c.contains(e.relatedTarget)&&!pop.contains(e.relatedTarget))leave()});
pop.addEventListener('mouseleave',e=>{if(!cur||!cur.contains(e.relatedTarget))leave()});
pop.addEventListener('click',e=>{const b=e.target.closest('[data-lib]');if(!b||!cur)return;const m=M[cur.dataset.k],on=toggleLib(m);b.classList.toggle('on',on);b.innerHTML=ic(on?'check':'plus')});
addEventListener('scroll',leave,{passive:true,capture:true});

/* ---------- hero carousel ---------- */
function heroCar(it){
  const el=$('#hero');if(!el||!it.length)return;
  el.innerHTML=it.map((m,i)=>`<div class="sl${i?'':' on'}"><div class="hb" style="background-image:linear-gradient(90deg,rgba(7,8,11,.7),transparent 62%),url('${h(m.background)}')"></div><div class="hc">${logoOrName(m)}<div class="mt">${mt(m)}</div><p>${h(m.description||'')}</p><div class="acts"><a class="pill" href="${dt(m)}">${ic('play')}Play</a></div></div></div>`).join('')+`<div class="dots">${it.map((_,i)=>`<button class="${i?'':'on'}" aria-label="Slide ${i+1}"></button>`).join('')}</div>`;
  let k=0,t;
  const go=i=>{k=i;el.querySelectorAll('.sl').forEach((s,j)=>s.classList.toggle('on',j===i));el.querySelectorAll('.dots button').forEach((d,j)=>d.classList.toggle('on',j===i));setAmb(it[i].background)};
  const nx=()=>{if(!document.body.contains(el))return clearInterval(t);go((k+1)%it.length)};
  el.querySelectorAll('.dots button').forEach((d,i)=>d.onclick=()=>{go(i);clearInterval(t);t=setInterval(nx,7000)});
  t=setInterval(nx,7000);setAmb(it[0].background);
}

/* ---------- sources on the detail page ---------- */
const SRC={t:0};
async function loadSrc(type,id,vid){
  const box=$('#srcs');if(!box)return;
  const sid=vid||id,list=addons.filter(a=>has(a,'stream',type,sid)),tok=SRC.t=Math.random();
  if(!list.length)return box.innerHTML='<p class="note">No source can provide streams yet. Add one in <a href="#/settings"><u>Settings</u></a>.</p>';
  box.innerHTML=LDS;const S=[];let n=0;
  await Promise.all(list.map(async a=>{
    const r=await call(a,'stream',type,sid).catch(()=>({}));if(SRC.t!==tok)return;
    const st=r.streams||[];if(!st.length)return;n+=st.length;
    const el=document.createElement('div');el.className='sg';
    el.innerHTML=`<h3>${h(a.manifest.name)}</h3>`+st.map(s=>{S.push(s);return`<button class="stream" data-i="${S.length-1}">${qc(s)}${h((s.name||'Stream').replace(/\n/g,' '))}<small>${h(s.title||s.description||'')}</small></button>`}).join('');
    box.querySelector('.ldw')?.remove();box.append(el);
    el.querySelectorAll('.stream').forEach(b=>b.onclick=()=>{PICK=S[b.dataset.i];location.hash=watchUrl(type,id,vid)});
  }));
  if(SRC.t===tok){box.querySelector('.ldw')?.remove();if(!n)box.insertAdjacentHTML('beforeend','<p class="sub">No source returned a stream for this title.</p>')}
}

/* ---------- pages ---------- */
const V={
  async home(){
    if(!addons.length)return app.innerHTML='<div class="msg">Could not load the default catalog. Check your connection and reload.</div>';
    const cs=cats().filter(x=>/^(movie|series)$/.test(x.c.type)).slice(0,40),P=cs.map(({a,c})=>call(a,'catalog',c.type,c.id).then(r=>r.metas||[]).catch(()=>[]));
    const cw=Object.values(LS.get('prog',{})).sort((a,b)=>b.at-a.at).slice(0,12);
    app.innerHTML=`<section class="hero" id="hero">${LD}</section>`
      +(cw.length?`<section class="row"><h2>Continue watching</h2><div class="scroll">${cw.map(p=>`<a class="card" href="#/title/${p.type}/${encodeURIComponent(p.id)}"><img src="${h(p.poster||'')}" alt="${h(p.name)}"><div class="bar"><i style="width:${Math.min(100,100*p.t/(p.d||1))}%"></i></div></a>`).join('')}</div></section>`:'')
      +cs.map((x,i)=>`<section class="row" id="r${i}"><h2>${h((x.c.name||x.c.id)+' '+typeLabel(x.c.type).toLowerCase())}</h2><div class="scroll">${'<i class="ph"></i>'.repeat(9)}</div></section>`).join('');
    P.forEach((p,i)=>p.then(m=>{const s=$(`#r${i} .scroll`);if(!s)return;m.length?s.innerHTML=m.slice(0,30).map(card).join(''):s.parentNode.remove()}));
    const [a=[],b=[]]=await Promise.all([P[0],P[1]]);
    const A=a.filter(m=>m.background).slice(0,20),B=b.filter(m=>m.background).slice(0,20),it=[];
    for(let i=0;i<20;i++){if(A[i])it.push(A[i]);if(B[i])it.push(B[i])}
    heroCar(it);
  },
  async discover(type='movie'){
    const list=cats().filter(x=>x.c.type===type);

/* ---------- player ---------- */
let HL=null;
function play(s,ctx,t0){
  const box=$('#vw'),ld=$('#ld');if(!box)return;
  if(HL){HL.destroy();HL=null}box.innerHTML='';ld.classList.add('on');
  const fail=t=>{ld.classList.remove('on');box.innerHTML=`<div class="msg">${t}</div>`};
  if(s.ytId&&!s.url){ld.classList.remove('on');return box.innerHTML=`<iframe src="https://www.youtube.com/embed/${encodeURIComponent(s.ytId)}?autoplay=1" allow="autoplay;fullscreen" allowfullscreen></iframe>`}
  if(s.externalUrl&&!s.url){ld.classList.remove('on');return open(s.externalUrl,'_blank','noopener')}
  if(!s.url||/^(magnet|torrent):/.test(s.url))return fail('This source is a torrent. Browsers cannot play torrents directly. Choose a source that returns direct HTTPS links.');
  if(location.protocol==='https:'&&s.url.startsWith('http:'))toast('This link is not HTTPS, so your browser may block it.');
  const v=document.createElement('video');v.autoplay=v.playsInline=true;v.preload='auto';box.append(v);
  if(/\.m3u8(\?|$)/i.test(s.url)&&window.Hls&&Hls.isSupported()){HL=new Hls();HL.loadSource(s.url);HL.attachMedia(v)}else v.src=s.url;
  const key=ctx.vid||ctx.id;let last=0;
  const ui=()=>{const d=v.duration||0,p=$('#pg');if(!p)return;p.style.width=(d?100*v.currentTime/d:0)+'%';$('#tt').textContent=ft(v.currentTime)+' / '+ft(d);try{$('#bf').style.width=d&&v.buffered.length?100*v.buffered.end(v.buffered.length-1)/d+'%':'0'}catch{}};
  v.onerror=()=>fail('This source cannot play in the browser. Open the sources menu and try another one.');
  v.onwaiting=()=>ld.classList.add('on');
  v.onplaying=()=>ld.classList.remove('on');
  v.onpause=v.onplay=()=>{const p=$('#pl');if(!p)return;$('#pp').innerHTML=ic(v.paused?'play':'pause');p.wake&&p.wake()};
  v.onvolumechange=()=>{$('#vb')&&($('#vb').innerHTML=ic(v.muted||!v.volume?'mute':'vol'))};
  v.onloadedmetadata=()=>{const p=LS.get('prog',{})[key],t=t0||(p&&p.t>30&&p.t<v.duration-60?p.t:0);if(t)v.currentTime=t};
  v.ontimeupdate=()=>{ui();if(Date.now()-last<5000)return;last=Date.now();const p=LS.get('prog',{});p[key]={...ctx,t:v.currentTime,d:v.duration,at:last};LS.set('prog',p)};
  v.onprogress=ui;v.onended=()=>{const n=$('#nx');n&&n.click()};
  addSubs(v,ctx);
}
async function addSubs(v,ctx){
  const sid=ctx.vid||ctx.id;
  for(const a of addons.filter(a=>has(a,'subtitles',ctx.type,sid))){
    const r=await call(a,'subtitles',ctx.type,sid).catch(()=>({}));
    for(const s of(r.subtitles||[]).slice(0,8)){
      try{
        const t=await(await fetch(s.url)).text();
        const vtt=t.startsWith('WEBVTT')?t:'WEBVTT\n\n'+t.replace(/\r/g,'').replace(/(\d+:\d+:\d+),(\d+)/g,'$1.$2');
        const tr=document.createElement('track');tr.kind='subtitles';tr.label=s.lang||'Subtitles';tr.src=URL.createObjectURL(new Blob([vtt],{type:'text/vtt'}));tr.default=false;v.append(tr);tr.track.mode='hidden';
      }catch{}
    }
  }
}
document.addEventListener('keydown',e=>{
  const pl=$('#pl'),v=pl&&$('#vw video');if(!pl||e.target.matches('input:not(#vs)'))return;
  const k=e.key;pl.wake&&pl.wake();
  if(k==='Escape'&&!document.fullscreenElement)return $('#top a').click();
  if(!v)return;
  if(k===' '||k==='k'){e.preventDefault();v.paused?v.play():v.pause()}
  else if(k==='ArrowRight')v.currentTime+=10;else if(k==='ArrowLeft')v.currentTime-=10;
  else if(k==='ArrowUp'){e.preventDefault();v.volume=Math.min(1,v.volume+.1);$('#vs').value=v.volume}
  else if(k==='ArrowDown'){e.preventDefault();v.volume=Math.max(0,v.volume-.1);$('#vs').value=v.volume}
  else if(k==='f')$('#fs').click();else if(k==='m')v.muted=!v.muted;
});

async function route(){
  const path=location.hash.slice(2),[p='',...r]=path.split('/');
  syncNav();pm.classList.remove('on');leave();hideResume();scrollTo(0,0);setAmb();
  if(HL){HL.destroy();HL=null}

  app.innerHTML=LD;
  try{await(V[p||'home']||V.home)(...r)}catch(e){app.innerHTML=`<div class="msg">Something went wrong: ${h(e.message)}</div>`}
}
$('#ft').innerHTML=`<a class="logo" href="#/">${LOGO}<span>KINORA</span></a><span>Kinora does not host or store any media. Everything comes from the sources you add.</span>`;

dock();syncNav();
window.boot=async()=>{
  if(!addons.some(a=>a.core)){try{addons.unshift({url:CINEMETA,manifest:await getJSON(CINEMETA),core:1});LS.set('addons',addons)}catch{}}
  route();

/* ----- reactions with animated emoji ----- */
const EM={love:['❤️','Loved it'],like:['👍','Liked it'],dislike:['👎','Disliked it']};
function burst(el,r){
  const [e,t]=EM[r],b=el.getBoundingClientRect();
  for(let i=0;i<(r==='love'?8:4);i++){
    const s=document.createElement('span');s.className='fx';s.textContent=e;
    s.style.cssText=`left:${b.left+b.width/2}px;top:${b.top}px;--dx:${(Math.random()-.5)*110}px;--dy:${-70-Math.random()*80}px;--r:${(Math.random()-.5)*50}deg;animation-delay:${i*70}ms`;
    document.body.append(s);setTimeout(()=>s.remove(),1500);
  }
  toast(e+' '+t);
}

/* ----- person popup (Wikipedia + Wikidata) ----- */
async function openPerson(n,ph){
  const d=document.createElement('div');d.className='dmod';
  d.innerHTML=`<div class="dcard pcard"><button class="rb" id="dx" aria-label="Close">${ic('x')}</button><div id="pb2">${LDS}</div></div>`;
  document.body.append(d);d.onclick=e=>{if(e.target===d||e.target.closest('#dx'))d.remove()};
  try{
    const s=await getJSON('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(n.replace(/ /g,'_')));
    let rows=[];
    if(s.wikibase_item){
      const q=s.wikibase_item,e=((await getJSON('https://www.wikidata.org/wiki/Special:EntityData/'+q+'.json')).entities[q]||{}).claims||{};
      const val=p=>(e[p]||[]).map(c=>c.mainsnak&&c.mainsnak.datavalue&&c.mainsnak.datavalue.value).filter(Boolean);
      const dt1=p=>{const v=val(p)[0],x=v&&v.time&&/(\d{4})-(\d\d)-(\d\d)/.exec(v.time);return x?new Date(Date.UTC(+x[1],(+x[2]||1)-1,+x[3]||1)):null};
      const b=dt1('P569'),dd=dt1('P570'),ids=[...val('P19'),...val('P26'),...val('P27')].map(v=>v.id).filter(Boolean),lab={};
      if(ids.length){const r=await getJSON('https://www.wikidata.org/w/api.php?action=wbgetentities&ids='+[...new Set(ids)].join('|')+'&props=labels&languages=en&format=json&origin=*');for(const k in r.entities)lab[k]=(r.entities[k].labels.en||{}).value}
      const L=p=>val(p).map(v=>lab[v.id]).filter(Boolean).join(', '),fd=x=>x.toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric',timeZone:'UTC'});
      const age=b?Math.floor(((dd||new Date())-b)/31557600000):null,hv=val('P2048')[0];
      rows=[['Born',b?fd(b):''],['Died',dd?fd(dd):''],['Age',age!=null?(dd?age+' (at death)':age):''],['Birthplace',L('P19')],['Spouse',L('P26')],['Citizenship',L('P27')],['Height',hv&&hv.amount?parseFloat(hv.amount).toFixed(2)+' m':'']].filter(x=>x[1]);
    }
    const img=(s.thumbnail&&s.thumbnail.source)||ph;
    $('#pb2').innerHTML=`<div class="pp">${img?`<img src="${h(img)}" alt="" referrerpolicy="no-referrer">`:''}<div><h2>${h(s.title||n)}</h2><div class="mt">${h(s.description||'')}</div></div></div>${rows.length?`<div class="dg" style="margin-top:14px">${rows.map(x=>`<div><small>${h(x[0])}</small>${h(x[1])}</div>`).join('')}</div>`:''}<p class="pbio">${h((s.extract||'').slice(0,520))}${(s.extract||'').length>520?'…':''}</p>${s.content_urls?`<a class="btn" target="_blank" rel="noopener" href="${h(s.content_urls.desktop.page)}">Read more on Wikipedia</a>`:''}`;
  }catch{$('#pb2').innerHTML=`<h2>${h(n)}</h2><p class="sub" style="margin-top:10px">No profile was found for this person.</p>`}
}

/* ----- banner: only well-rated titles, progress-fill dots ----- */
heroCar=function(all){
  const el=$('#hero');if(!el)return;
  const rt=m=>parseFloat(m.imdbRating)||0,ok=m=>m.background&&!(CFG().hideAdult&&adult(m));
  let it=all.filter(m=>ok(m)&&rt(m)>=7.4);
  if(it.length<5)it=all.filter(ok).sort((a,b)=>rt(b)-rt(a)).slice(0,6);
  it=it.slice(0,8);if(!it.length)return;
  it.forEach(m=>{M[m.type+'|'+m.id]=m});
  el.innerHTML=it.map((m,i)=>`<div class="sl${i?'':' on'}"><div class="hb" style="background-image:linear-gradient(90deg,rgba(7,8,11,.7),transparent 62%),url('${h(m.background)}')"></div><div class="hc">${logoOrName(m)}<div class="mt">${mt(m)}</div><p>${h(m.description||'')}</p><div class="acts"><a class="pill" href="${dt(m)}">${ic('play')}Play</a></div></div></div>`).join('')
    +`<div class="dots${CFG().hero?'':' pz'}">${it.map((_,i)=>`<button class="${i?'':'on'}" aria-label="Slide ${i+1}"><i></i></button>`).join('')}</div>`;
  let k=0;const ds=[...el.querySelectorAll('.dots button')],ss=[...el.querySelectorAll('.sl')];
  const go=i=>{k=i;ss.forEach((s,j)=>s.classList.toggle('on',j===i));ds.forEach(d=>d.classList.remove('on'));void el.offsetWidth;ds[i].classList.add('on');setAmb(it[i].background)};
  ds.forEach((d,i)=>d.onclick=()=>go(i));
  el.querySelector('.dots').addEventListener('animationend',e=>{if(CFG().hero&&e.target.parentNode.classList.contains('on'))go((k+1)%it.length)});
  setAmb(it[0].background);
};

/* ----- search: more results, relevance order, related titles ----- */
V.search=async function(q=''){
  q=decodeURIComponent(q);const ql=q.toLowerCase();
  app.innerHTML=`<div class="page"><h1>Results for “${h(q)}”</h1><div id="sr"></div><div id="sl">${LDS}</div></div>`;
  const seen=new Set(),res={movie:[],series:[]},rel={},srcs=cats().filter(x=>(x.c.extra||[]).some(e=>e.name==='search'));
  const sc=m=>{const n=(m.name||'').toLowerCase();return n===ql?0:n.startsWith(ql)?1:n.includes(ql)?2:3},rt=m=>parseFloat(m.imdbRating)||0;
  const draw=fin=>{
    const s=$('#sr');if(!s)return;
    const sec=(t,l)=>res[t]&&res[t].length?`<h2>${l}</h2><div class="grid">${res[t].slice().sort((a,b)=>sc(a)-sc(b)||rt(b)-rt(a)).map((m,i)=>card(m,i)).join('')}</div>`:'';
    s.innerHTML=sec('movie','Movies')+sec('series','Series')+(fin?Object.entries(rel).map(([t,l])=>l.length?`<h2>Related ${typeLabel(t).toLowerCase()}</h2><div class="grid">${l.map((m,i)=>card(m,i)).join('')}</div>`:'').join(''):'');
    if(fin){const l=$('#sl');if(l)l.remove();if(!s.innerHTML)s.innerHTML='<p class="sub">No results. Try a different spelling.</p>'}
  };
  const jobs=[];
  srcs.forEach(({a,c})=>['','&skip=25'].forEach(x=>jobs.push((async()=>{
    const r=await call(a,'catalog',c.type,c.id,'search='+encodeURIComponent(q)+x).catch(()=>({}));
    for(const m of r.metas||[])if(!seen.has(m.type+m.id)){seen.add(m.type+m.id);(res[m.type]||(res[m.type]=[])).push(m)}
    draw();
  })())));
  await Promise.all(jobs);
  const top=[...res.movie,...res.series].sort((a,b)=>sc(a)-sc(b)||rt(b)-rt(a))[0],cm=addons.find(x=>x.core);
  if(top&&top.genres&&top.genres.length&&cm){
    await Promise.all(['movie','series'].map(async t=>{
      if(!res[t].length&&t!==top.type)return;
      const r=await call(cm,'catalog',t,'top','genre='+encodeURIComponent(top.genres[0])).catch(()=>({}));
      rel[t]=(r.metas||[]).filter(m=>!seen.has(m.type+m.id)).slice(0,18);
    }));
  }
  draw(true);
};

    LS.set('st',{...(d.st||{}),...LS.get('st',{})});
    LS.set('ew',{...(d.ew||{}),...LS.get('ew',{})});
    const pr=LS.get('prog',{});for(const k in d.prog||{})if(!pr[k]||(d.prog[k].at||0)>(pr[k].at||0))pr[k]=d.prog[k];LS.set('prog',pr);
    if(d.sub)LS.set('sub',{...LS.get('sub',{}),...d.sub});
    for(const u of d.addons||[])if(!addons.some(a=>a.url===u))await addAddon(u).catch(()=>{});
  }else if(!LS.get('me','')){LS.set('me',meta.full_name||meta.name||(USER.email||'').split('@')[0])}
  pulling=false;applyCfg();renderPm();await push();toast('Your data is synced');
}

V.profile=function(){
  const c=CL(),n=LS.get('me',''),av=LS.get('av',0),ready=!!(c.url&&c.key),last=LS.get('lastsync',0);
  const acct=!ready?`<p class="note">Cloud sync is not connected yet. Add your Supabase project URL and key in <a href="#/settings"><u>Settings</u></a> to turn on accounts.</p>`
    :USER?`<div class="acard"><div><b>${h(USER.email||'Signed in')}</b><small>${last?'Last synced '+new Date(last).toLocaleString():'Not synced yet'}</small></div><button class="btn" id="sy">Sync now</button><button class="btn" id="so2">Sign out</button></div>`
    :`<form id="af2" class="auth"><input class="t" id="ae" type="email" placeholder="Email" autocomplete="email" required><input class="t" id="ap" type="password" placeholder="Password (6+ characters)" autocomplete="current-password" minlength="6" required><div class="acts"><button class="btn p" id="si">Sign in</button><button class="btn" type="button" id="su">Create account</button></div></form><div class="or"><span>or</span></div><button class="btn gbtn" id="gg"><svg viewBox="0 0 24 24"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.2 1.3-1.6 3.9-5.5 3.9a6.1 6.1 0 1 1 0-12.2c1.9 0 3.2.8 3.9 1.5l2.7-2.6A9.9 9.9 0 0 0 12 2a10 10 0 1 0 0 20c5.8 0 9.6-4 9.6-9.8 0-.7-.1-1.2-.2-2z"/></svg>Continue with Google</button>`;
  app.innerHTML=`<div class="page"><h1>Edit profile</h1><div class="pe"><div class="avb">${avatarSvg(av)}</div><div class="pf"><label class="lbl">Name<input class="t" id="pn" value="${h(n)}" maxlength="30" placeholder="Your name"></label><label class="lbl">Email<input class="t" value="${h(USER?USER.email:'')}" placeholder="Guest · sign in to add an email" disabled></label></div></div>
    <h2>Choose an avatar</h2><div class="avg">${Array.from({length:12},(_,i)=>`<button class="avs${i===av?' on':''}" data-a="${i}" aria-label="Avatar ${i+1}">${avatarSvg(i)}</button>`).join('')}</div>
    <h2>Account and sync</h2><p class="sub">Your name, avatar, sources, settings, library, reactions and watch progress are saved to your account so they follow you to any device.</p>${acct}</div>`;
  $('#pn').oninput=e=>{LS.set('me',e.target.value.trim());renderPm()};
  app.querySelectorAll('.avs').forEach(b=>b.onclick=()=>{LS.set('av',+b.dataset.a);app.querySelectorAll('.avs').forEach(x=>x.classList.toggle('on',x===b));$('.pe .avb').innerHTML=avatarSvg(+b.dataset.a);renderPm()});
  if(ready){
    sbInit();
    if(USER){$('#sy').onclick=async()=>{await pull();V.profile()};$('#so2').onclick=signOut}
    else{
      const run=async f=>{try{await f($('#ae').value.trim(),$('#ap').value)}catch(e){toast(e.message||'Something went wrong')}};
      $('#af2').onsubmit=e=>{e.preventDefault();run(signIn)};$('#su').onclick=()=>run(signUp);
      if(IS_APP){const o=$('.or');if(o)o.remove();$('#gg').remove()}else $('#gg').onclick=()=>googleIn().catch(e=>toast(e.message||'Google sign-in is not enabled for this project'));
    }
  }
};

/* ----- progress helpers: resume bar, detail progress, continue-from ----- */
const progFor=m=>Object.values(LS.get('prog',{})).filter(p=>p.id===m.id&&p.type===m.type&&p.d&&p.t>15&&p.t/p.d<.95).sort((a,b)=>b.at-a.at)[0];

}
function resumeCard(m,type,id,vid){

  const p=Object.values(LS.get('prog',{})).filter(x=>x.d&&x.t>20&&x.t/x.d<.93).sort((a,b)=>b.at-a.at)[0];if(!p)return;

  document.body.append(el);
  el.querySelector('.rp').onclick=()=>{PICK=null;window.START0=false};
  el.querySelector('.rx').onclick=()=>{sessionStorage.setItem('rdx','1');el.classList.remove('on');setTimeout(()=>el.remove(),400)};
  setTimeout(()=>el.classList.add('on'),1000);
  setTimeout(()=>{if(el.isConnected){el.classList.remove('on');setTimeout(()=>el.remove(),400)}},16000);
}

/* ----- playability: smarter source ranking and optional playback server ----- */
const qOf=s=>{const t=((s.name||'')+' '+(s.title||s.description||'')).toLowerCase();return/2160p|\b4k\b|uhd/.test(t)?2160:/1080p|fhd/.test(t)?1080:/720p/.test(t)?720:/480p|\bsd\b/.test(t)?480:0};
const HEVC_OK=(()=>{try{return!!(window.MediaSource&&MediaSource.isTypeSupported('video/mp4; codecs="hvc1.1.6.L93.B0"'))}catch{return false}})();
const qd=s=>{
  const q=qOf(s),p=CFG().quality,t=((s.name||'')+' '+(s.title||s.description||'')).toLowerCase();
  let d=!q?1.5:p==='best'?(2160-q)/1000:Math.abs(q-p)/400;
  if(!HEVC_OK&&/hevc|x265|h\.?265/.test(t))d+=4;
  if(/dts|truehd|atmos|e-?ac-?3|dd\+/.test(t))d+=2;
  if(!HEVC_OK&&q>1080)d+=1.5;
  return d;
};
const srvCfg=()=>LS.get('srv',{});
const SRVOK=()=>{const s=srvCfg();return!!(s.url&&s.key)};
const srvStream=s=>{
  const c=srvCfg(),hd=s.behaviorHints&&s.behaviorHints.proxyHeaders&&s.behaviorHints.proxyHeaders.request;
  const q=`u=${encodeURIComponent(s.url)}&k=${encodeURIComponent(c.key)}${hd?'&h='+encodeURIComponent(btoa(JSON.stringify(hd))):''}`;
  return{...s,_srv:1,url:`${c.url.replace(/\/$/,'')}/stream.m3u8?${q}`};
};
